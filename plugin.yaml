name: rtk-rewrite
version: "1.0.0"
description: >-
  Community (non-official) Hermes plugin that rewrites terminal commands through
  RTK (rtk-ai/rtk, Apache-2.0) before execution, so Hermes sees compact command
  output. Adds a pre_tool_call hook, an optional desktop pane and update
  scripts. Not affiliated with the upstream RTK project.
author: kerrz2020
license: Apache-2.0
homepage: https://github.com/kerrz2020/hermes-rtk-rewrite
tags: [rtk, tokens, terminal, proxy, hermes]
hooks:
  - pre_tool_call
provides_hooks:
  - pre_tool_call
